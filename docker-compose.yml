services:
  api:
    image: omnitenant-account:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      # Uploaded CMS media — must outlive container rebuilds.
      - uploads:/app/uploads
    restart: unless-stopped

  # AI worker (src/worker.ts): queued AI feature jobs + scheduled AI tasks.
  # Same image; no ports. Migrations are run by `api`, not here.
  worker:
    image: omnitenant-account:local
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped
    # Lets a running job finish on `docker compose stop`.
    stop_grace_period: 2m
    # The image's HEALTHCHECK probes the API port, which the worker does not open.
    healthcheck:
      disable: true

volumes:
  uploads:
